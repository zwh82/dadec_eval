[Main]
seed=632741178
# maximum number of processes
max_processors=16

# 0: community design + read simulator,
# 1: read simulator only
phase=0

# ouput directory, where the output will be stored (will be overwritten if set in from_profile)
output_directory=


# temporary directory
temp_directory=/tmp

# gold standard assembly
gsa=True

# gold standard for all samples combined
pooled_gsa=True

# anonymize sequences?
anonymous=True

# compress data (levels 0-9, recommended is 1 the gain of higher levels is not too high)
compress=1

# id of dataset, used in foldernames and is prefix in anonymous sequences
dataset_id=LR

[ReadSimulator]
# which readsimulator to use:
#           Choice of 'art', 'wgsim', 'nanosim', 'pbsim'
type=pbsim

# Samtools (http://www.htslib.org/) takes care of sam/bam files. Version 1.0 or higher required!
# file path to executable
samtools=/home/yczhang/zyc/tools/CAMISIM-master/tools/samtools-1.3/samtools

# ART_Illumina (2008-2015) (Weichun Huang at whduke@gmail.com). Version 2.3.6 recommended!
# file path to executable
readsim=/home/yczhang/zyc/tools/pbsim2/install/bin/pbsim

# Directory containing error profiles for ART_Illumina
error_profiles=/home/yczhang/zyc/tools/pbsim2/data/

# Supported profiles: "mi": EmpMiSeq250R, "hi": EmpHiSeq2kR, "hi150": HiSeq2500L150R
profile=CLR

# Mean size (bp) of fragment simulated by ART (read length depends on error profile)
fragments_size_mean=12000
# Standard deviation (bp) of fragments simulated by ART
fragment_size_standard_deviation=3000

[CommunityDesign]
# specify the samples size in Giga base pairs
size=

# how many different samples?
number_of_samples=1

# how many communities
num_communities=1

# directory containing the taxdump of ncbi, version from 22.02.2017 is shipped
# "nodes.dmp"
# "merged.dmp"
# "names.dmp"
ncbi_taxdump=/home/wenhai/application/camisim/CAMISIM/tools/ncbi-taxonomy_20230915.tar.gz

# the strain simulator for de novo strain creation
strain_simulation_template=/home/yczhang/zyc/tools/CAMISIM-master/scripts/StrainSimulationWrapper/sgEvolver/simulation_dir/


# define communities: [community<integer>]
[community0]
# information about all included genomes:
# can be used for multiple samples
metadata=
id_to_genome_file=

distribution_file_paths=
# how many genomes do you want to sample over all?
genomes_total=
num_real_genomes=

# how many genomes per species taxon
#   (species taxon will be replaced by OTU-cluster later on)
max_strains_per_otu=10
ratio=1

# which kind of different samples do you need?
#   replicates / timeseries_lognormal / timeseries_normal / differential
mode=differential

# Part: community design
# Set parameters of log-normal and normal distribution, number of samples
# sigma > 0; influences shape (higher sigma -> smaller peak and longer tail),
log_sigma=2

# mu (real number) is a parameter for the log-scale
log_mu=1

# normal dsitribution parameters used for replicates
gauss_mu=1
gauss_sigma=1

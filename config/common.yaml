environments:
  evaluation: dadec_eval
  methods:
    dadec: DADEC
    fmlrc: dadec_eval
    f_hero: hero
    ratatosk: dadec_eval
    r_hero: hero
    lordec: dadec_eval
    l_hero: hero
    colormap: dadec_eval
    proovread: proovread
    vechat: vechat
    dechat: vechat

methods: all
parameter_profile: study
evaluation_only: false
parameters:
  profiles:
    tool_defaults: {}
    study:
      dadec_k1: 31
      dadec_k2: 31
      fmlrc_k1: 21
      fmlrc_k2: 59
      ratatosk_k1: 31
      ratatosk_k2: 63
      lordec_k: 21
  hero_split: 10
  hero_iterations: 3
  lordec_solid: 5

resources:
  method_threads: 64
  metaquast_threads: 64
  min_free_disk_gb: 40

dadec:
  split_number: 1
  msa_threshold: 0.08
  abundance_min1: 2
  abundance_min2: 1

metaquast:
  ambiguity_usage: all
  ambiguity_scores: [0.99, 0.9999]
  min_contig: 500
  # Previous report-only speed flags (kept for provenance):
  # extra_args: "--no-html --no-icarus --no-krona"
  extra_args: "--fast"

quast:
  min_contig: 500
  # Previous report-only speed flags (kept for provenance):
  # extra_args: "--no-html --no-icarus"
  extra_args: "--fast"

quast_cleanup:
  threshold_mib: 100

evaluation:
  tool: metaquast

paths:
  run_root: benchmark/runs
  work: benchmark/work
  results: benchmark/results
  logs: benchmark/logs
